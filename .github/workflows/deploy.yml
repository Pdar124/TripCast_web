name: Deploy

on:
  pull_request:
    branches:
      - main
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-validation-{0}', github.event.pull_request.number) || 'production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pdar124/tripcast-web
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  validate-image:
    name: Validate Docker image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/' }}
            VITE_KAKAO_MAP_APP_KEY=${{ vars.VITE_KAKAO_MAP_APP_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Build and publish image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}

    steps:
      - name: Check out deployment commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ env.DEPLOY_SHA }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/' }}
            VITE_KAKAO_MAP_APP_KEY=${{ vars.VITE_KAKAO_MAP_APP_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select immutable image
        id: image
        run: echo "reference=${REGISTRY}/${IMAGE_NAME}:sha-${DEPLOY_SHA}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy to EC2
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      BACKEND_UPSTREAM: ${{ vars.BACKEND_UPSTREAM }}
      IMAGE_REFERENCE: ${{ needs.publish.outputs.image }}
      GHCR_TOKEN_PARAMETER: /tripcast/deploy/${{ github.run_id }}-${{ github.run_attempt }}/ghcr-token
      REMOTE_SCRIPT: /tmp/tripcast-web-deploy-${{ github.run_id }}-${{ github.run_attempt }}.sh
      WEB_PORT: ${{ vars.TRIPCAST_WEB_PORT || '80' }}

    steps:
      - name: Check out deployment script
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate deployment configuration
        run: |
          test -n "${AWS_REGION}"
          test -n "${AWS_ROLE_ARN}"
          [[ "${EC2_INSTANCE_ID}" =~ ^i-[0-9a-f]+$ ]]
          [[ "${BACKEND_UPSTREAM}" =~ ^https?:// ]]
          [[ "${WEB_PORT}" =~ ^[0-9]+$ ]]

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: TripCastWeb-${{ github.run_id }}

      - name: Check SSM managed node
        run: |
          PING_STATUS="$(
            aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text
          )"

          if [[ "${PING_STATUS}" != "Online" ]]; then
            echo "EC2 instance is not online in Systems Manager: ${PING_STATUS}" >&2
            exit 1
          fi

      - name: Store temporary GHCR token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "${GHCR_TOKEN}"
          aws ssm put-parameter \
            --name "${GHCR_TOKEN_PARAMETER}" \
            --description "Temporary GHCR token for TripCast web deployment" \
            --type SecureString \
            --value "${GHCR_TOKEN}" \
            --overwrite >/dev/null

      - name: Send deployment command
        id: command
        env:
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -Eeuo pipefail

          export DEPLOY_SCRIPT_BASE64
          DEPLOY_SCRIPT_BASE64="$(base64 --wrap=0 scripts/deploy-ec2.sh)"

          node scripts/create-ssm-command.mjs > "${RUNNER_TEMP}/ssm-parameters.json"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "${EC2_INSTANCE_ID}" \
              --document-name AWS-RunShellScript \
              --comment "TripCast web ${DEPLOY_SHA}" \
              --parameters "file://${RUNNER_TEMP}/ssm-parameters.json" \
              --timeout-seconds 600 \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "command-id=${COMMAND_ID}" >> "${GITHUB_OUTPUT}"
          echo "Sent SSM command ${COMMAND_ID}"

      - name: Wait for deployment
        env:
          COMMAND_ID: ${{ steps.command.outputs.command-id }}
        run: |
          set -Eeuo pipefail

          STATUS=""
          for _ in $(seq 1 120); do
            STATUS="$(
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --query Status \
                --output text 2>/dev/null || true
            )"

            case "${STATUS}" in
              Success | Cancelled | TimedOut | Failed | Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          echo "SSM command status: ${STATUS:-unknown}"
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query StandardOutputContent \
            --output text || true
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query StandardErrorContent \
            --output text >&2 || true

          [[ "${STATUS}" == "Success" ]]

      - name: Remove temporary GHCR token
        if: always()
        run: |
          aws ssm delete-parameter --name "${GHCR_TOKEN_PARAMETER}" || true
