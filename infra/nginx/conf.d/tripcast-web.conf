# 2단계: HTTPS 적용 설정 (인증서 발급 후 사용)
# /etc/letsencrypt/live/tripcastwith.duckdns.org/ 아래에 인증서가 있어야 `nginx -t`가 통과합니다.
# 발급 전에는 tripcast-web.http.conf(1단계)를 사용합니다.

# 80: ACME 검증과 헬스체크는 그대로 두고, 나머지는 HTTPS로 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name tripcastwith.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        return 301 https://tripcastwith.duckdns.org$request_uri;
    }
}

# 443: TLS 종료 후 React 컨테이너로 전달
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tripcastwith.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/tripcastwith.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tripcastwith.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 처음에는 5분으로 짧게 둡니다. HTTPS가 안정적인 것을 확인한 뒤 늘립니다(docs/deployment.md).
    # duckdns.org는 공용 도메인이므로 includeSubDomains/preload는 사용하지 않습니다.
    add_header Strict-Transport-Security "max-age=300" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
